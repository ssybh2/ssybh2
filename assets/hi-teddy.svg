<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-label="Hi, I'm Teddy — Aerospace Engineering at UNNC">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1020"/>
      <stop offset="0.55" stop-color="#10182C"/>
      <stop offset="1" stop-color="#0A1120"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6EC8FF" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#6EC8FF"/>
      <stop offset="0.62" stop-color="#E8C86A"/>
      <stop offset="1" stop-color="#E8C86A" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-50%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <clipPath id="clip">
      <rect x="8" y="8" width="984" height="234" rx="30"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="8" y="8" width="984" height="234" rx="30" fill="url(#panel)" stroke="#26324B" stroke-width="2"/>
  </g>

  <g clip-path="url(#clip)">
    <!-- very subtle moving night glow -->
    <circle cx="170" cy="40" r="150" fill="#14396E" opacity=".12">
      <animate attributeName="cx" values="140;220;140" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="36;54;36" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="210" r="180" fill="#7B5B24" opacity=".08">
      <animate attributeName="cx" values="820;880;820" dur="22s" repeatCount="indefinite"/>
    </circle>

    <!-- title -->
    <text x="500" y="84"
          text-anchor="middle"
          font-family="Inter, Arial, Helvetica, sans-serif"
          font-size="58"
          font-weight="800"
          letter-spacing="0.4"
          fill="#F3F6FB">Hi, I'm</text>

    <text x="500" y="162"
          text-anchor="middle"
          font-family="Inter, Arial, Helvetica, sans-serif"
          font-size="96"
          font-weight="900"
          letter-spacing="1"
          fill="#E7C86C"
          filter="url(#softGlow)">Teddy</text>

    <!-- understated animated underline -->
    <path d="M360 179 C432 189 568 189 640 179"
          fill="none"
          stroke="#E7C86C"
          stroke-width="5"
          stroke-linecap="round"
          opacity=".9">
      <animate attributeName="d"
               values="M360 179 C432 189 568 189 640 179;
                       M360 180 C430 184 570 194 640 180;
                       M360 179 C432 189 568 189 640 179"
               dur="7.5s"
               repeatCount="indefinite"/>
    </path>

    <!-- subtitle -->
    <text x="500" y="210"
          text-anchor="middle"
          font-family="Inter, Arial, Helvetica, sans-serif"
          font-size="23"
          font-weight="600"
          letter-spacing="1.2"
          fill="#B7C4DA">✈ Aerospace Engineering @ UNNC</text>

    <!-- interests rail -->
    <text x="500" y="235"
          text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13"
          font-weight="600"
          letter-spacing="2.2"
          fill="#7EA8C8">DRONE RACING · REINFORCEMENT LEARNING · EMBODIED AI · UAV R&amp;D · STILL EXPLORING</text>

    <rect x="-220" y="225" width="180" height="2.5" rx="1.25" fill="url(#line)" opacity=".9">
      <animate attributeName="x" values="-220;1040" dur="6.8s" repeatCount="indefinite"/>
    </rect>

    <!-- small restrained sparkles -->
    <g fill="#E7C86C" filter="url(#softGlow)">
      <circle cx="745" cy="63" r="3.5">
        <animate attributeName="opacity" values=".35;1;.35" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="r" values="2.4;4.1;2.4" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="788" cy="93" r="2.2">
        <animate attributeName="opacity" values=".25;.85;.25" dur="4.1s" begin=".7s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>