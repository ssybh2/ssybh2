<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" role="img" aria-label="Hi, I'm Teddy">
  <defs>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF0A8"/>
      <stop offset="26%" stop-color="#F8D86E"/>
      <stop offset="55%" stop-color="#E8B84F"/>
      <stop offset="78%" stop-color="#FFD978"/>
      <stop offset="100%" stop-color="#C8922E"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8922E" stop-opacity=".28"/>
      <stop offset="50%" stop-color="#FFE38C"/>
      <stop offset="100%" stop-color="#C8922E" stop-opacity=".28"/>
    </linearGradient>
    <filter id="goldGlow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- single-line title only -->
  <text x="165" y="76"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="64"
        font-weight="800"
        letter-spacing=".4"
        fill="#F5F7FB">Hi, I'm</text>

  <text x="455" y="76"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="70"
        font-weight="900"
        letter-spacing=".7"
        fill="url(#goldText)"
        filter="url(#goldGlow)">Teddy</text>

  <path d="M458 92 C520 98 587 98 650 91"
        fill="none"
        stroke="url(#goldLine)"
        stroke-width="4.5"
        stroke-linecap="round">
    <animate attributeName="d"
             values="M458 92 C520 98 587 98 650 91;
                     M458 93 C520 96 587 101 650 92;
                     M458 92 C520 98 587 98 650 91"
             dur="6.5s"
             repeatCount="indefinite"/>
  </path>

  <!-- subtle twinkling stars around Teddy -->
  <g fill="#FFE48E" stroke="#FFF2B7" stroke-linecap="round" filter="url(#goldGlow)">
    <g transform="translate(430 34)">
      <circle r="3.4"/>
      <path d="M0-10V10M-10 0H10" stroke-width="1.6"/>
      <animate attributeName="opacity" values=".25;1;.25" dur="2.8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" additive="sum" type="scale" values=".8;1.18;.8" dur="2.8s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(685 32)">
      <circle r="2.8"/>
      <path d="M0-8V8M-8 0H8" stroke-width="1.4"/>
      <animate attributeName="opacity" values=".2;.95;.2" dur="3.5s" begin=".5s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(705 73)">
      <circle r="2.3"/>
      <animate attributeName="r" values="1.6;3.2;1.6" dur="3.2s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;.85;.2" dur="3.2s" begin="1s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(500 104)">
      <circle r="2.1"/>
      <animate attributeName="opacity" values=".15;.8;.15" dur="4s" begin=".8s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>