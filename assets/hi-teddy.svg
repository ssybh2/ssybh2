<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" role="img" aria-label="Hi, I'm Teddy">
  <defs>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF2A8"/>
      <stop offset="28%" stop-color="#F8D66D"/>
      <stop offset="58%" stop-color="#E7B74F"/>
      <stop offset="82%" stop-color="#FFD978"/>
      <stop offset="100%" stop-color="#C9952E"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D7A93E" stop-opacity=".35"/>
      <stop offset=".5" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#D7A93E" stop-opacity=".35"/>
    </linearGradient>
    <filter id="goldGlow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="2.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(450 74)">
    <text x="-290" y="0"
          font-family="Inter, Arial, Helvetica, sans-serif"
          font-size="62"
          font-weight="800"
          letter-spacing=".4"
          fill="#F4F7FB">Hi, I'm</text>

    <text x="112" y="4"
          font-family="Inter, Arial, Helvetica, sans-serif"
          font-size="68"
          font-weight="900"
          letter-spacing=".8"
          fill="url(#goldText)"
          filter="url(#goldGlow)">Teddy</text>

    <path d="M35 28 C96 35 157 35 218 27"
          fill="none"
          stroke="url(#goldLine)"
          stroke-width="5"
          stroke-linecap="round">
      <animate attributeName="d"
               values="M35 28 C96 35 157 35 218 27;
                       M35 29 C96 32 157 39 218 28;
                       M35 28 C96 35 157 35 218 27"
               dur="6.5s"
               repeatCount="indefinite"/>
    </path>

    <!-- restrained golden star field around Teddy -->
    <g fill="#FFE28A" stroke="#FFF2B8" stroke-linecap="round" filter="url(#goldGlow)">
      <g transform="translate(32 -36)">
        <circle r="3.8"/>
        <path d="M0-11V11M-11 0H11" stroke-width="1.8"/>
        <animate attributeName="opacity" values=".3;1;.3" dur="2.8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" additive="sum" type="scale" values=".8;1.2;.8" dur="2.8s" repeatCount="indefinite"/>
      </g>

      <g transform="translate(242 -27)">
        <circle r="3.2"/>
        <path d="M0-9V9M-9 0H9" stroke-width="1.5"/>
        <animate attributeName="opacity" values=".25;.95;.25" dur="3.4s" begin=".6s" repeatCount="indefinite"/>
      </g>

      <g transform="translate(270 17)">
        <circle r="2.7"/>
        <path d="M0-8V8M-8 0H8" stroke-width="1.4"/>
        <animate attributeName="opacity" values=".2;.9;.2" dur="2.9s" begin="1.1s" repeatCount="indefinite"/>
      </g>

      <g transform="translate(73 43)">
        <circle r="2.4"/>
        <animate attributeName="r" values="1.8;3.4;1.8" dur="3.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".25;.85;.25" dur="3.7s" repeatCount="indefinite"/>
      </g>

      <g transform="translate(190 47)">
        <circle r="2.1"/>
        <animate attributeName="opacity" values=".2;.8;.2" dur="4.1s" begin=".8s" repeatCount="indefinite"/>
      </g>

      <g transform="translate(302 -4)">
        <circle r="1.8"/>
        <animate attributeName="opacity" values=".15;.75;.15" dur="3.2s" begin="1.4s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>
</svg>