<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" role="img" aria-label="Hi, I'm Teddy">
  <defs>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="24%" stop-color="#F7D66A"/>
      <stop offset="52%" stop-color="#E6B64A"/>
      <stop offset="78%" stop-color="#FFD978"/>
      <stop offset="100%" stop-color="#C78E26"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C78E26" stop-opacity=".2"/>
      <stop offset="50%" stop-color="#FFE58F"/>
      <stop offset="100%" stop-color="#C78E26" stop-opacity=".2"/>
    </linearGradient>
    <filter id="starGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Larger, sharper single-line title -->
  <text x="110" y="80"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="72"
        font-weight="800"
        letter-spacing=".3"
        fill="#F5F7FB">Hi, I'm</text>

  <text x="445" y="80"
        font-family="Inter, Arial, Helvetica, sans-serif"
        font-size="82"
        font-weight="900"
        letter-spacing=".6"
        fill="url(#goldText)">Teddy</text>

  <path d="M450 98 C520 105 596 105 667 97"
        fill="none"
        stroke="url(#goldLine)"
        stroke-width="4.8"
        stroke-linecap="round">
    <animate attributeName="d"
             values="M450 98 C520 105 596 105 667 97;
                     M450 99 C520 102 596 108 667 98;
                     M450 98 C520 105 596 105 667 97"
             dur="6.2s"
             repeatCount="indefinite"/>
  </path>

  <!-- Clearly animated golden stars around Teddy -->
  <g fill="#FFE58F" stroke="#FFF4BE" stroke-linecap="round" filter="url(#starGlow)">
    <g transform="translate(426 27)">
      <g>
        <circle r="3.6"/>
        <path d="M0-11V11M-11 0H11M-7-7L7 7M7-7L-7 7" stroke-width="1.5"/>
        <animateTransform attributeName="transform" type="scale" values=".55;1.35;.55" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".12;1;.12" dur="2.4s" repeatCount="indefinite"/>
      </g>
    </g>

    <g transform="translate(704 27)">
      <g>
        <circle r="3"/>
        <path d="M0-9V9M-9 0H9" stroke-width="1.4"/>
        <animateTransform attributeName="transform" type="scale" values=".6;1.45;.6" dur="3.1s" begin=".4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".08;1;.08" dur="3.1s" begin=".4s" repeatCount="indefinite"/>
      </g>
    </g>

    <g transform="translate(738 65)">
      <g>
        <circle r="2.6"/>
        <path d="M0-8V8M-8 0H8" stroke-width="1.3"/>
        <animateTransform attributeName="transform" type="rotate" values="0;45;0" dur="3.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".12;.95;.12" dur="2.7s" begin=".8s" repeatCount="indefinite"/>
      </g>
    </g>

    <g transform="translate(479 108)">
      <circle r="2.2">
        <animate attributeName="r" values="1.4;3.5;1.4" dur="3.3s" begin=".7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".08;.9;.08" dur="3.3s" begin=".7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(620 108)">
      <circle r="2">
        <animate attributeName="r" values="1.2;3.1;1.2" dur="2.8s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".08;.88;.08" dur="2.8s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(773 42)">
      <circle r="1.8">
        <animate attributeName="r" values="1;2.8;1" dur="3.6s" begin=".2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".05;.8;.05" dur="3.6s" begin=".2s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>