<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 118" role="img" aria-label="Hi, I'm Teddy">
  <defs>
    <linearGradient id="teddy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67D8FF"/>
      <stop offset="48%" stop-color="#F4D06F"/>
      <stop offset="100%" stop-color="#FF9BC2"/>
    </linearGradient>
    <linearGradient id="underline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67D8FF"/>
      <stop offset="55%" stop-color="#F4D06F"/>
      <stop offset="100%" stop-color="#FF9BC2"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="shineMask">
      <rect width="900" height="118" fill="white"/>
    </mask>
  </defs>

  <!-- direct, readable one-line title -->
  <g transform="translate(450 63)" text-anchor="middle">
    <text x="-92" y="0"
          font-family="Inter, Arial, Helvetica, sans-serif"
          font-size="54"
          font-weight="800"
          letter-spacing="0.5"
          fill="#F4F7FB">Hi, I'm</text>

    <text x="116" y="0"
          font-family="Inter, Arial, Helvetica, sans-serif"
          font-size="60"
          font-weight="900"
          letter-spacing="0.8"
          fill="url(#teddy)"
          filter="url(#glow)">Teddy</text>

    <!-- clear accent underline -->
    <path d="M34 19 C93 27 158 27 219 18"
          fill="none"
          stroke="url(#underline)"
          stroke-width="5"
          stroke-linecap="round">
      <animate attributeName="d"
               values="M34 19 C93 27 158 27 219 18;
                       M34 19 C93 23 158 31 219 18;
                       M34 19 C93 27 158 27 219 18"
               dur="5.8s"
               repeatCount="indefinite"/>
    </path>

    <!-- small wave/spark, kept secondary -->
    <g transform="translate(258 -13)" stroke="#F4D06F" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#glow)">
      <path d="M0 -11 V11 M-11 0 H11"/>
      <circle r="3.5" fill="#F4D06F" stroke="none"/>
      <animateTransform attributeName="transform" additive="sum" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".65;1;.65" dur="2.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- subtle moving highlight over Teddy only -->
  <rect x="-120" y="20" width="70" height="70" rx="20" fill="#ffffff" opacity=".10" transform="skewX(-16)">
    <animate attributeName="x" values="-120;910" dur="6.8s" repeatCount="indefinite"/>
  </rect>
</svg>