<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" role="img" aria-label="Animated elegant ocean current">
<defs>
  <linearGradient id="deep" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#03131f"/>
    <stop offset=".35" stop-color="#07324a"/>
    <stop offset=".68" stop-color="#0c5a73"/>
    <stop offset="1" stop-color="#041b29"/>
  </linearGradient>
  <linearGradient id="wave" x1="0" x2="1">
    <stop stop-color="#4fd0d0"/><stop offset=".45" stop-color="#b9f4e8"/><stop offset=".8" stop-color="#62b8ce"/><stop offset="1" stop-color="#1b6a8c"/>
  </linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="water" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency=".014 .09" numOctaves="2" seed="5" result="n">
      <animate attributeName="baseFrequency" values=".014 .09;.018 .075;.014 .09" dur="14s" repeatCount="indefinite"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
  </filter>
  <clipPath id="c"><rect width="1200" height="180" rx="28"/></clipPath>
</defs>
<g clip-path="url(#c)">
  <rect width="1200" height="180" fill="url(#deep)"/>
  <path d="M-80 86 C85 26 239 28 372 78 C513 131 657 131 800 75 C936 22 1078 27 1270 91"
        fill="none" stroke="url(#wave)" stroke-width="13" stroke-linecap="round" opacity=".92" filter="url(#water)" stroke-dasharray="28 14">
    <animate attributeName="stroke-dashoffset" values="0;-84" dur="10s" repeatCount="indefinite"/>
  </path>
  <path d="M-90 119 C90 67 225 76 362 111 C505 147 658 153 806 113 C953 73 1088 78 1270 129"
        fill="none" stroke="#2f9eb5" stroke-width="8" stroke-linecap="round" opacity=".63" filter="url(#water)" stroke-dasharray="18 14">
    <animate attributeName="stroke-dashoffset" values="0;64" dur="12s" repeatCount="indefinite"/>
  </path>

  <!-- manta silhouette -->
  <g transform="translate(395 98)" opacity=".9">
    <path d="M0 0 C-27-33-72-31-104-10 C-72-9-49 12-26 21 C-12 27-5 20 0 13 C5 20 12 27 26 21 C49 12 72-9 104-10 C72-31 27-33 0 0Z"
          fill="#071e2a" stroke="#75d8d0" stroke-width="2.4"/>
    <path d="M0 12 C4 30 4 42 0 54" stroke="#75d8d0" stroke-width="3" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="translate" values="395 98;420 92;395 98" dur="8s" repeatCount="indefinite"/>
  </g>

  <!-- jellyfish -->
  <g transform="translate(860 86)" opacity=".82">
    <path d="M-23 0 C-20-28 20-28 23 0 Z" fill="#91e7e2" opacity=".3" stroke="#aef8ef" stroke-width="2"/>
    <path d="M-15 0 C-12 14-18 27-10 40 M-3 0 C-2 14 3 27 0 43 M10 0 C12 14 6 27 12 38"
          fill="none" stroke="#aef8ef" stroke-width="2" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="translate" values="860 86;860 76;860 86" dur="5.5s" repeatCount="indefinite"/>
  </g>

  <!-- bioluminescent particles -->
  <g fill="#b9fff3" filter="url(#soft)">
    <circle cx="110" cy="132" r="2.3"><animate attributeName="cy" values="132;45" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="155" r="1.8"><animate attributeName="cy" values="155;60" dur="8.2s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="8.2s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="150" r="2.1"><animate attributeName="cy" values="150;55" dur="7.8s" begin=".4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.85;0" dur="7.8s" begin=".4s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="150" r="2.2"><animate attributeName="cy" values="150;48" dur="8.7s" begin="1.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="8.7s" begin="1.4s" repeatCount="indefinite"/></circle>
  </g>

  <g fill="#6fd2d2" opacity=".5">
    <circle cx="54" cy="50" r="2"/><circle cx="307" cy="45" r="2"/><circle cx="524" cy="61" r="2.2"/>
    <circle cx="715" cy="45" r="1.8"/><circle cx="947" cy="55" r="2"/><circle cx="1130" cy="38" r="2.2"/>
  </g>
</g>
</svg>