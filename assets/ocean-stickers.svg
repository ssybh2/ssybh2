<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" role="img" aria-label="Ocean themed sticker strip">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop stop-color="#081c2b"/><stop offset=".5" stop-color="#0c3b4f"/><stop offset="1" stop-color="#082537"/>
    </linearGradient>
    <filter id="ds"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="180" rx="28" fill="url(#bg)"/>

  <!-- wave sticker -->
  <g transform="translate(135 90)" filter="url(#ds)">
    <circle r="58" fill="#f5fbff" stroke="#9ae3e7" stroke-width="5"/>
    <path d="M-40 18 C-16-8 4-5 18 3 C34 12 45 8 52 1 C43 31 20 43-9 39 C-28 36-39 29-47 23Z" fill="#1ca7bc"/>
    <path d="M-36 15 C-10-8 10-3 20 5" fill="none" stroke="#78dce2" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- manta -->
  <g transform="translate(365 88)" filter="url(#ds)">
    <circle r="58" fill="#f5fbff" stroke="#9ae3e7" stroke-width="5"/>
    <path d="M0 2 C-18-26-49-24-66-6 C-40-9-29 9-14 15 C-6 18-2 12 0 9 C2 12 6 18 14 15 C29 9 40-9 66-6 C49-24 18-26 0 2Z" fill="#18364c"/>
    <path d="M0 8v34" stroke="#18364c" stroke-width="5" stroke-linecap="round"/>
    <animateTransform attributeName="transform" type="translate" values="365 88;365 82;365 88" dur="3.4s" repeatCount="indefinite"/>
  </g>

  <!-- turtle -->
  <g transform="translate(600 90)" filter="url(#ds)">
    <circle r="58" fill="#f5fbff" stroke="#9ae3e7" stroke-width="5"/>
    <ellipse rx="30" ry="21" fill="#65aa7c"/>
    <path d="M-18-13Q0-25 18-13Q24 0 18 13Q0 25-18 13Q-24 0-18-13Z" fill="#3d8667"/>
    <circle cx="37" cy="-2" r="10" fill="#75b78e"/>
    <path d="M-17-14l-19-15M-17 14l-19 15M18-14l17-14M18 14l17 14" stroke="#75b78e" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- shell -->
  <g transform="translate(835 90)" filter="url(#ds)">
    <circle r="58" fill="#f5fbff" stroke="#9ae3e7" stroke-width="5"/>
    <path d="M-38 21 Q-30-38 0-43 Q30-38 38 21 Q19 40 0 42 Q-19 40-38 21Z" fill="#f2b5a2" stroke="#d7827c" stroke-width="3"/>
    <path d="M0-40V36M-22-30L-10 36M22-30L10 36M-35-8L-19 34M35-8L19 34" stroke="#fff0e9" stroke-width="4" opacity=".9"/>
  </g>

  <!-- tiny drone / star -->
  <g transform="translate(1065 90)" filter="url(#ds)">
    <circle r="58" fill="#f5fbff" stroke="#9ae3e7" stroke-width="5"/>
    <g stroke="#17364b" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M-10 0h20M0-5v10M-10 0l-20-14M10 0l20-14M-10 0l-20 14M10 0l20 14"/>
      <ellipse cx="-32" cy="-15" rx="11" ry="3"><animateTransform attributeName="transform" type="rotate" from="0 -32 -15" to="360 -32 -15" dur=".6s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="32" cy="-15" rx="11" ry="3"><animateTransform attributeName="transform" type="rotate" from="0 32 -15" to="-360 32 -15" dur=".6s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="-32" cy="15" rx="11" ry="3"><animateTransform attributeName="transform" type="rotate" from="0 -32 15" to="-360 -32 15" dur=".6s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="32" cy="15" rx="11" ry="3"><animateTransform attributeName="transform" type="rotate" from="0 32 15" to="360 32 15" dur=".6s" repeatCount="indefinite"/></ellipse>
    </g>
  </g>
</svg>