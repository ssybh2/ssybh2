<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Animated painterly starry night">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050817"/>
    <stop offset=".28" stop-color="#0b1a3e"/>
    <stop offset=".58" stop-color="#123f78"/>
    <stop offset=".82" stop-color="#152f66"/>
    <stop offset="1" stop-color="#070b1d"/>
  </linearGradient>
  <radialGradient id="moonGlow">
    <stop offset="0" stop-color="#fff9c9"/>
    <stop offset=".22" stop-color="#ffe57b"/>
    <stop offset=".48" stop-color="#e8b23f" stop-opacity=".75"/>
    <stop offset="1" stop-color="#e8b23f" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="blueBrush" x1="0" x2="1">
    <stop stop-color="#183f98"/>
    <stop offset=".35" stop-color="#4a8fe9"/>
    <stop offset=".65" stop-color="#86c0ff"/>
    <stop offset="1" stop-color="#264fa8"/>
  </linearGradient>
  <linearGradient id="goldBrush" x1="0" x2="1">
    <stop stop-color="#a86f1d"/>
    <stop offset=".3" stop-color="#f2ba42"/>
    <stop offset=".58" stop-color="#ffe79b"/>
    <stop offset="1" stop-color="#c18021"/>
  </linearGradient>
  <filter id="oil" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency=".018 .075" numOctaves="3" seed="8" result="n">
      <animate attributeName="baseFrequency" values=".018 .075;.021 .068;.018 .075" dur="16s" repeatCount="indefinite"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="B"/>
  </filter>
  <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="clip"><rect width="1200" height="360" rx="30"/></clipPath>
</defs>

<g clip-path="url(#clip)">
  <rect width="1200" height="360" fill="url(#sky)"/>

  <!-- subtle canvas grain -->
  <g opacity=".18" filter="url(#oil)">
    <path d="M-80 70 C100 8 240 18 365 58 C500 102 620 104 756 59 C886 15 1030 17 1280 77" fill="none" stroke="#2d5cb3" stroke-width="28"/>
    <path d="M-60 123 C95 71 238 77 356 113 C487 154 624 161 760 116 C900 70 1045 74 1260 133" fill="none" stroke="#326dc7" stroke-width="22"/>
    <path d="M-50 182 C130 122 268 130 390 170 C512 210 652 213 800 164 C927 121 1062 125 1255 180" fill="none" stroke="#1e4c9b" stroke-width="24"/>
  </g>

  <!-- moving sky currents -->
  <g fill="none" stroke-linecap="round" filter="url(#oil)">
    <path d="M-80 96 C88 24 251 33 373 80 C508 132 636 127 760 76 C892 22 1043 28 1270 105"
          stroke="url(#blueBrush)" stroke-width="15" stroke-dasharray="34 18" opacity=".9">
      <animate attributeName="stroke-dashoffset" values="0;-104" dur="13s" repeatCount="indefinite"/>
    </path>
    <path d="M-70 151 C92 94 238 99 365 138 C497 178 641 184 773 142 C919 95 1061 102 1260 158"
          stroke="#72aefa" stroke-width="8" stroke-dasharray="19 15" opacity=".6">
      <animate attributeName="stroke-dashoffset" values="0;68" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M20 226 C178 185 300 186 425 215 C561 247 690 250 820 216 C960 179 1080 182 1220 224"
          stroke="#173f83" stroke-width="17" stroke-dasharray="42 22" opacity=".75">
      <animate attributeName="stroke-dashoffset" values="0;-128" dur="18s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- animated spiral clouds -->
  <g transform="translate(245 137)" filter="url(#oil)">
    <g fill="none" stroke-linecap="round">
      <path d="M-106 16 C-76-50 21-69 80-23 C136 21 109 95 40 101 C-20 106-56 67-33 32 C-14 3 31-3 52 18 C69 36 57 63 33 68"
            stroke="#4b8fe7" stroke-width="14"/>
      <path d="M-91 13 C-62-31 9-46 57-17 C101 9 92 61 52 77 C17 91-21 72-26 43"
            stroke="#9ac8ff" stroke-width="5" opacity=".7"/>
    </g>
    <animateTransform attributeName="transform" additive="sum" type="rotate" values="0;5;0;-4;0" dur="14s" repeatCount="indefinite"/>
  </g>

  <g transform="translate(655 112)" filter="url(#oil)">
    <g fill="none" stroke-linecap="round">
      <path d="M-104 5 C-73-45 7-62 67-29 C126 4 124 72 69 98 C19 121-37 93-41 49 C-44 13-4-11 31 2 C60 13 66 46 45 63"
            stroke="#376fc4" stroke-width="16"/>
      <path d="M-87 3 C-55-31 5-41 48-17 C87 6 88 49 55 69 C24 88-12 75-24 47"
            stroke="#84bbff" stroke-width="5" opacity=".62"/>
    </g>
    <animateTransform attributeName="transform" additive="sum" type="rotate" values="0;-4;0;5;0" dur="17s" repeatCount="indefinite"/>
  </g>

  <!-- moon and golden ring strokes -->
  <circle cx="1015" cy="82" r="78" fill="url(#moonGlow)" filter="url(#softGlow)">
    <animate attributeName="r" values="76;84;76" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1015" cy="82" r="20" fill="#ffe78a"/>
  <g transform="translate(1015 82)" fill="none" stroke="url(#goldBrush)" stroke-linecap="round" filter="url(#oil)">
    <path d="M-58 6 C-43-31-12-49 22-43 C55-37 75-8 68 23 C61 53 33 69 7 64" stroke-width="8" stroke-dasharray="26 12">
      <animate attributeName="stroke-dashoffset" values="0;-76" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M-71-11 C-50-50-5-72 37-58" stroke-width="4" opacity=".65" stroke-dasharray="12 10">
      <animate attributeName="stroke-dashoffset" values="0;44" dur="7s" repeatCount="indefinite"/>
    </path>
    <animateTransform attributeName="transform" additive="sum" type="rotate" values="0;360" dur="42s" repeatCount="indefinite"/>
  </g>

  <!-- stars -->
  <g fill="#ffe99c" stroke="#ffdc6a" stroke-linecap="round" filter="url(#softGlow)">
    <g transform="translate(116 62)">
      <circle r="5"/><path d="M0-20V20M-20 0H20M-14-14L14 14M14-14L-14 14" stroke-width="3"/>
      <animateTransform attributeName="transform" additive="sum" type="scale" values=".85;1.18;.85" dur="3.2s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(407 48)">
      <circle r="4"/><path d="M0-15V15M-15 0H15" stroke-width="2.5"/>
      <animate attributeName="opacity" values=".35;1;.35" dur="2.7s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(774 54)">
      <circle r="5"/><path d="M0-17V17M-17 0H17" stroke-width="2.5"/>
      <animateTransform attributeName="transform" additive="sum" type="rotate" values="0;20;0;-20;0" dur="5s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(1115 139)">
      <circle r="4"/><path d="M0-14V14M-14 0H14" stroke-width="2"/>
      <animate attributeName="opacity" values=".4;1;.4" dur="3.8s" repeatCount="indefinite"/>
    </g>
  </g>

  <g fill="#f5e9ad" opacity=".9">
    <circle cx="319" cy="42" r="2.6"/><circle cx="522" cy="67" r="2.2"/><circle cx="588" cy="38" r="3"/>
    <circle cx="845" cy="30" r="2.5"/><circle cx="915" cy="150" r="2.1"/><circle cx="1070" cy="32" r="2.8"/>
    <circle cx="1165" cy="65" r="2.4"/><circle cx="702" cy="182" r="2.1"/>
  </g>

  <!-- rolling village -->
  <path d="M0 274 C125 245 210 251 295 271 C385 292 473 290 553 267 C650 239 757 240 852 266 C960 295 1073 294 1200 262 L1200 360 L0 360Z" fill="#07111c"/>
  <path d="M0 293 C131 262 227 268 323 289 C420 310 536 306 641 282 C756 256 863 263 958 287 C1055 311 1135 306 1200 286"
        fill="none" stroke="#143650" stroke-width="17" opacity=".82" filter="url(#oil)"/>

  <!-- cypress -->
  <g fill="#041116" filter="url(#oil)">
    <path d="M96 360 C77 332 83 305 108 281 C86 252 96 219 128 195 C105 161 121 124 160 95 C145 137 155 165 174 190 C197 222 180 259 154 281 C177 312 172 337 160 360Z"/>
    <path d="M166 360 C155 335 160 314 179 297 C164 275 172 251 193 236 C181 210 194 188 217 172 C205 203 215 224 230 245 C244 270 231 294 215 308 C228 327 227 345 221 360Z" opacity=".82"/>
  </g>

  <!-- village lights -->
  <g fill="#f3c35a" filter="url(#softGlow)" opacity=".82">
    <rect x="468" y="306" width="5" height="5" rx="1"/><rect x="535" y="296" width="5" height="5" rx="1"/>
    <rect x="611" y="305" width="5" height="5" rx="1"/><rect x="744" y="299" width="5" height="5" rx="1"/>
    <rect x="867" y="310" width="5" height="5" rx="1"/><rect x="955" y="302" width="5" height="5" rx="1"/>
    <rect x="1084" y="299" width="5" height="5" rx="1"/>
  </g>

  <text x="64" y="320" font-family="Georgia, serif" font-size="31" fill="#f7efd8" font-weight="600" letter-spacing="1.3">still exploring the night</text>
  <text x="66" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#d8bd70" letter-spacing="3.1">BUILD · FLY · LEARN · WANDER</text>
</g>
</svg>