<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Animated post-impressionist starry night banner">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071229"/><stop offset="0.45" stop-color="#0b1f4a"/><stop offset="0.75" stop-color="#16336a"/><stop offset="1" stop-color="#0a1732"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff9c7"/><stop offset="0.35" stop-color="#ffd968"/><stop offset="0.75" stop-color="#d7962f"/><stop offset="1" stop-color="#d7962f" stop-opacity="0"/>
