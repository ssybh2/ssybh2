<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" role="img" aria-label="Things I play with">
<defs>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#161b28"/>
    <stop offset=".55" stop-color="#111725"/>
    <stop offset="1" stop-color="#0b101b"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".28"/>
    <stop offset=".55" stop-color="#7fa8ff" stop-opacity=".16"/>
    <stop offset="1" stop-color="#ffffff" stop-opacity=".06"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity=".36"/>
  </filter>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1200" height="160" rx="26" fill="#080c14"/>

<!-- helper: each card is 132x132, 30px margins, 12px gaps -->
<!-- YouTube -->
<g transform="translate(30 14)" filter="url(#shadow)">
  <rect width="132" height="132" rx="26" fill="url(#card)" stroke="url(#edge)" stroke-width="2"/>
  <rect x="27" y="28" width="78" height="55" rx="17" fill="#ff0033"/>
  <path d="M58 41 L83 55.5 L58 70 Z" fill="#fff"/>
  <text x="66" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#f7f9ff">YouTube</text>
</g>

<!-- Isaac Sim -->
<g transform="translate(174 14)" filter="url(#shadow)">
  <rect width="132" height="132" rx="26" fill="url(#card)" stroke="url(#edge)" stroke-width="2"/>
  <g transform="translate(66 54)" fill="none" stroke="#76b900" stroke-width="4" stroke-linejoin="round" filter="url(#glow)">
    <path d="M0-25 25-11 25 17 0 31-25 17-25-11Z"/>
    <path d="M0-25V3M25-11 0 3-25-11M0 3V31"/>
    <circle cx="0" cy="3" r="4" fill="#bdf56d" stroke="none"/>
  </g>
  <text x="66" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#f7f9ff">Isaac Sim</text>
</g>

<!-- Douyin -->
<g transform="translate(318 14)" filter="url(#shadow)">
  <rect width="132" height="132" rx="26" fill="url(#card)" stroke="url(#edge)" stroke-width="2"/>
  <g transform="translate(66 54)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5-27V17C5 30-14 33-20 22C-27 9-11 0 5 8" stroke="#25f4ee" stroke-width="9" transform="translate(-4 2)"/>
    <path d="M5-27C9-12 18-5 31-4" stroke="#25f4ee" stroke-width="9" transform="translate(-4 2)"/>
    <path d="M5-27V17C5 30-14 33-20 22C-27 9-11 0 5 8" stroke="#fe2c55" stroke-width="9" transform="translate(4 -2)"/>
    <path d="M5-27C9-12 18-5 31-4" stroke="#fe2c55" stroke-width="9" transform="translate(4 -2)"/>
    <path d="M5-27V17C5 30-14 33-20 22C-27 9-11 0 5 8" stroke="#fff" stroke-width="6"/>
    <path d="M5-27C9-12 18-5 31-4" stroke="#fff" stroke-width="6"/>
  </g>
  <text x="66" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#f7f9ff">Douyin</text>
</g>

<!-- GitHub -->
<g transform="translate(462 14)" filter="url(#shadow)">
  <rect width="132" height="132" rx="26" fill="url(#card)" stroke="url(#edge)" stroke-width="2"/>
  <g transform="translate(66 55)" fill="#f2f4f8">
    <circle r="29"/>
    <path d="M-22-20 -30-35 -11-29M22-20 30-35 11-29" stroke="#f2f4f8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-10" cy="-2" r="3" fill="#111725"/><circle cx="10" cy="-2" r="3" fill="#111725"/>
    <path d="M-12 12 Q0 20 12 12" fill="none" stroke="#111725" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="66" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#f7f9ff">GitHub</text>
</g>

<!-- Linux -->
<g transform="translate(606 14)" filter="url(#shadow)">
  <rect width="132" height="132" rx="26" fill="url(#card)" stroke="url(#edge)" stroke-width="2"/>
  <g transform="translate(66 53)">
    <ellipse cx="0" cy="2" rx="25" ry="31" fill="#f4f4f2"/>
    <ellipse cx="0" cy="-6" rx="19" ry="22" fill="#23252a"/>
    <ellipse cx="-7" cy="-10" rx="4" ry="6" fill="#fff"/><ellipse cx="7" cy="-10" rx="4" ry="6" fill="#fff"/>
    <circle cx="-6" cy="-10" r="1.8" fill="#111"/><circle cx="6" cy="-10" r="1.8" fill="#111"/>
    <path d="M-8 0 Q0 8 8 0 Q0-4-8 0Z" fill="#f6bf31"/>
    <ellipse cx="-16" cy="27" rx="13" ry="6" fill="#f6bf31"/><ellipse cx="16" cy="27" rx="13" ry="6" fill="#f6bf31"/>
  </g>
  <text x="66" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#f7f9ff">Linux</text>
</g>

<!-- ROS 2 -->
<g transform="translate(750 14)" filter="url(#shadow)">
  <rect width="132" height="132" rx="26" fill="url(#card)" stroke="url(#edge)" stroke-width="2"/>
  <g transform="translate(66 52)" fill="#dfeaff">
    <circle cx="-18" cy="-16" r="5"/><circle cx="0" cy="-16" r="5"/><circle cx="18" cy="-16" r="5"/>
    <circle cx="-18" cy="0" r="5"/><circle cx="0" cy="0" r="5"/><circle cx="18" cy="0" r="5"/>
    <circle cx="-18" cy="16" r="5"/><circle cx="0" cy="16" r="5"/><circle cx="18" cy="16" r="5"/>
  </g>
  <text x="66" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#f7f9ff">ROS 2</text>
</g>

<!-- Python -->
<g transform="translate(894 14)" filter="url(#shadow)">
  <rect width="132" height="132" rx="26" fill="url(#card)" stroke="url(#edge)" stroke-width="2"/>
  <g transform="translate(66 52)">
    <path d="M-4-29 C-23-29-28-18-28-8V4H1V10H-28C-39 10-44 19-44 29H-15C-5 29-1 23-1 15V-1H18C27-1 31-8 31-17V-29Z" fill="#3776ab"/>
    <circle cx="-10" cy="-18" r="3" fill="#fff"/>
    <path d="M4 29 C23 29 28 18 28 8V-4H-1V-10H28C39-10 44-19 44-29H15C5-29 1-23 1-15V1H-18C-27 1-31 8-31 17V29Z" fill="#ffd343"/>
    <circle cx="10" cy="18" r="3" fill="#fff"/>
  </g>
  <text x="66" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#f7f9ff">Python</text>
</g>

<!-- PyTorch -->
<g transform="translate(1038 14)" filter="url(#shadow)">
  <rect width="132" height="132" rx="26" fill="url(#card)" stroke="url(#edge)" stroke-width="2"/>
  <g transform="translate(66 52)" fill="none" stroke="#ee4c2c" stroke-width="8" stroke-linecap="round">
    <path d="M15-28 C6-20-11-8-20 4 C-31 20-21 39 0 40 C22 41 36 24 30 4"/>
    <circle cx="23" cy="-18" r="4" fill="#ee4c2c" stroke="none"/>
  </g>
  <text x="66" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#f7f9ff">PyTorch</text>
</g>
</svg>